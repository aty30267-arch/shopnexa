<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShopNexa Login</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fb;color:#17202a}.top{height:64px;background:#1769e0;color:#fff;display:flex;align-items:center;padding:0 7%;font-size:28px;font-weight:900}.wrap{min-height:calc(100vh - 64px);display:grid;place-items:center;padding:25px}.card{width:min(430px,100%);background:#fff;border-radius:16px;box-shadow:0 8px 35px #0001;padding:30px}.icon{width:58px;height:58px;border-radius:50%;background:#eaf2ff;display:grid;place-items:center;font-size:27px;margin-bottom:16px}.card h1{margin:0 0 7px;font-size:27px}.muted{color:#687386;font-size:14px;line-height:1.5}.input{width:100%;padding:14px;border:1px solid #d6dce5;border-radius:8px;margin:9px 0;outline:none}.input:focus{border-color:#1769e0}.btn{width:100%;padding:14px;border:0;border-radius:8px;background:#1769e0;color:#fff;font-weight:800;cursor:pointer;margin-top:8px}.otp{display:flex;gap:8px}.otp input{text-align:center;font-size:22px;font-weight:800}.hidden{display:none}.back{border:0;background:none;color:#1769e0;cursor:pointer;margin-top:14px}.note{background:#fff8df;padding:10px;border-radius:8px;font-size:12px;color:#675300;margin-top:15px}</style></head><body><div class="top">ShopNexa</div><main class="wrap"><section class="card"><div class="icon">🔐</div><div id="phoneStep"><h1>Login to ShopNexa</h1><p class="muted">Enter your mobile number to continue.</p><input id="phone" class="input" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number"><button class="btn" onclick="sendOtp()">Continue with OTP</button><div class="note">Secure login setup. Real SMS verification requires your own Firebase Phone Authentication project.</div></div><div id="otpStep" class="hidden"><h1>Verify your number</h1><p class="muted">Enter the 6-digit verification code sent to <b id="masked"></b>.</p><div class="otp">''' + ''.join([f'<input id="o{i}" class="input" maxlength="1" inputmode="numeric" oninput="next({i})" onkeydown="back(event,{i})">' for i in range(6)]) + '''</div><button class="btn" onclick="verify()">Verify & Continue</button><button class="back" onclick="resetLogin()">Change number</button><p id="msg" class="muted"></p></div></section></main><script>function sendOtp(){let p=document.getElementById('phone').value.replace(/\D/g,'');if(p.length!==10){alert('Please enter a valid 10-digit mobile number.');return}document.getElementById('phoneStep').classList.add('hidden');document.getElementById('otpStep').classList.remove('hidden');document.getElementById('masked').textContent='+91 '+p.slice(0,2)+'******'+p.slice(-2);document.getElementById('o0').focus()}function next(i){let x=document.getElementById('o'+i);x.value=x.value.replace(/\D/g,'');if(x.value&&i<5)document.getElementById('o'+(i+1)).focus()}function back(e,i){if(e.key==='Backspace'&&!document.getElementById('o'+i).value&&i>0)document.getElementById('o'+(i-1)).focus()}function verify(){document.getElementById('msg').textContent='Firebase SMS verification is not connected yet. Add your Firebase Web App configuration to enable real OTP delivery.'}function resetLogin(){document.getElementById('otpStep').classList.add('hidden');document.getElementById('phoneStep').classList.remove('hidden');}</script></body></html>
